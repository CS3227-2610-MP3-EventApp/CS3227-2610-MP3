services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventapp
      POSTGRES_USER: eventapp
      POSTGRES_PASSWORD: eventapp
    ports:
      - target: 5432
        published: "5432"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress
    volumes:
      - eventapp-postgres:/var/lib/postgresql/data

  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: eventapp_test
      POSTGRES_USER: eventapp_test
      POSTGRES_PASSWORD: eventapp_test
    ports:
      - target: 5432
        published: "5433"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress

volumes:
  eventapp-postgres:
